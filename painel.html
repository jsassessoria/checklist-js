<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Acompanhamento | JS Assessoria Contábil</title>
<link rel="stylesheet" href="styles.css?v=2">
<style>[hidden]{display:none!important}</style>
</head>
<body>
<main>
  <header>
    <div class="brand"><div class="monogram">JS</div><div><div class="brandname">Assessoria Contábil</div><div class="sub">ESTRATÉGIA E RESULTADO</div></div></div>
    <h1>Acompanhamento de documentação</h1>
    <p>Checklists enviados pelos clientes</p>
  </header>

  <form class="content" id="login">
    <div class="note">Área restrita do escritório. Digite a senha do painel.</div>
    <div class="login">
      <label for="senha">Senha<input type="password" id="senha" autocomplete="current-password"></label>
      <button class="primary" type="submit">Entrar</button>
    </div>
    <span class="saved" id="login-msg" aria-live="polite"></span>
  </form>

  <div class="content" id="painel" hidden>
    <div class="stats">
      <div class="stat"><strong id="s-total">0</strong><span>Clientes</span></div>
      <div class="stat"><strong id="s-comp">0</strong><span>Completos</span></div>
      <div class="stat"><strong id="s-pend">0</strong><span>Com pendências</span></div>
    </div>
    <div class="actions">
      <button id="atualizar">Atualizar lista</button>
      <button id="sair">Sair</button>
      <span class="saved" id="painel-msg" aria-live="polite"></span>
    </div>
    <div id="lista" style="display:flex;flex-direction:column;gap:10px"></div>
  </div>

  <footer>JS ASSESSORIA CONTÁBIL</footer>
</main>
<script src="config.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var TOTAL = ITENS.length;
  var senha = "";
  try { senha = sessionStorage.getItem("js-painel") || ""; } catch (e) {}

  function fmt(ts) { if (!ts) return "—"; var d = new Date(ts); return isNaN(d) ? "—" : d.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }); }
  function copiar(txt, btn) {
    var ok = function () { btn.textContent = "Copiado ✓"; };
    var falha = function () { btn.textContent = "Não foi possível copiar"; };
    try { navigator.clipboard.writeText(txt).then(ok, falha); } catch (e) { falha(); }
  }

  function render(rows) {
    rows.sort(function (a, b) { return (b.atualizadoEm || 0) - (a.atualizadoEm || 0); });
    $("s-total").textContent = rows.length;
    var comp = rows.filter(function (r) { return Number(r.marcados) >= TOTAL; }).length;
    $("s-comp").textContent = comp; $("s-pend").textContent = rows.length - comp;
    var lista = $("lista"); lista.replaceChildren();
    if (!rows.length) { lista.append(h("div", { "class": "empty", text: "Nenhum cliente enviou o checklist ainda." })); return; }
    rows.forEach(function (d) {
      var itens = d.itens || {};
      var n = Number(d.marcados) || 0;
      var chip = n >= TOTAL ? h("span", { "class": "chip ok", text: "Completo" }) : h("span", { "class": "chip warn", text: "Faltam " + (TOTAL - n) });
      var bar = h("div", { "class": "track" }, h("div", { "class": "bar" })); bar.firstChild.style.width = Math.min(100, 100 * n / TOTAL) + "%";
      var sum = h("summary", {}, h("span", { "class": "cname", text: d.empresa || "Empresa não informada" }), chip,
        h("div", { "class": "cmeta" }, h("span", { text: n + " de " + TOTAL }), bar, h("span", { text: "Atualizado " + fmt(d.atualizadoEm) })));
      var det = h("div", { "class": "detail" });
      det.append(h("div", { style: "font-size:13px;color:var(--muted)", text: "Responsável: " + (d.responsavel || "—") + " · Primeiro envio: " + fmt(d.criadoEm) }));
      SECOES.forEach(function (s) {
        var ul = h("ul");
        ITENS.filter(function (i) { return i.s === s[0]; }).forEach(function (i) {
          var y = !!itens[i.id];
          ul.append(h("li", { "class": y ? "y" : "n" }, h("span", { "class": "m", text: y ? "✓" : "✕" }), h("span", { text: i.t })));
        });
        det.append(h("h3", { text: s[0] }), ul);
      });
      if (d.observacoes) det.append(h("h3", { text: "Observações" }), h("div", { "class": "obsbox", text: String(d.observacoes) }));
      var pend = ITENS.filter(function (i) { return !itens[i.id]; }).map(function (i) { return "• " + i.t; });
      var acoes = h("div", { "class": "actions" });
      if (pend.length) {
        var bc = h("button", { type: "button", text: "Copiar pendências" });
        bc.onclick = function () { copiar("Olá! Para concluirmos o cadastro da " + (d.empresa || "sua empresa") + ", ainda faltam:\n" + pend.join("\n"), bc); };
        acoes.append(bc);
      }
      var bd = h("button", { type: "button", "class": "danger", text: "Excluir resposta" }); var conf = false;
      bd.onclick = function () {
        if (!conf) { conf = true; bd.textContent = "Clique de novo para excluir"; setTimeout(function () { conf = false; bd.textContent = "Excluir resposta"; }, 4000); return; }
        bd.disabled = true;
        chamarScript({ action: "excluir", senha: senha, id: d.id }).then(function (r) { if (!r.ok) throw 0; carregar(); })
          .catch(function () { bd.disabled = false; bd.textContent = "Não foi possível excluir"; });
      };
      acoes.append(bd); det.append(acoes);
      lista.append(h("details", { "class": "client" }, sum, det));
    });
  }

  function carregar() {
    $("painel-msg").textContent = "Carregando…";
    return chamarScript({ action: "listar", senha: senha }).then(function (r) {
      if (!r.ok) {
        if (r.erro === "senha") { sair(); $("login-msg").textContent = "Senha incorreta."; return; }
        throw new Error(r.erro);
      }
      $("login").hidden = true; $("login").style.display = "none"; $("painel").hidden = false; $("painel").style.display = ""; $("login-msg").textContent = "";
      render(r.respostas || []);
      $("painel-msg").textContent = "Atualizado às " + new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    }).catch(function (e) {
      var t = e.message === "config" ? "Falta configurar o link do Apps Script no arquivo config.js." : "Não foi possível carregar. Verifique a internet e tente de novo.";
      $("painel-msg").textContent = t; $("login-msg").textContent = t;
    });
  }
  function sair() { senha = ""; try { sessionStorage.removeItem("js-painel"); } catch (e) {} $("painel").hidden = true; $("painel").style.display = "none"; $("login").hidden = false; $("login").style.display = ""; $("senha").value = ""; }
  $("painel").style.display = "none";

  $("login").addEventListener("submit", function (ev) {
    ev.preventDefault(); senha = $("senha").value; if (!senha) return;
    try { sessionStorage.setItem("js-painel", senha); } catch (e) {}
    $("login-msg").textContent = "Verificando…"; carregar();
  });
  $("atualizar").onclick = carregar;
  $("sair").onclick = sair;
  if (senha) carregar();
})();
</script>
</body>
</html>
